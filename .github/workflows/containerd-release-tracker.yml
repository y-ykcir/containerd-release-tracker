name: Containerd Release Tracker

on:
  # Manual trigger
  workflow_dispatch:

jobs:
  analyze-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up environment variables
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        QIANFAN_TOKEN: ${{ secrets.QIANFAN_TOKEN }}
        RULIU_ACCESS_TOKEN: ${{ secrets.RULIU_ACCESS_TOKEN }}
        RULIU_TARGET_IDS: ${{ secrets.RULIU_TARGET_IDS }}
      run: |
        echo "GITHUB_TOKEN=${GITHUB_TOKEN}" >> $GITHUB_ENV
        echo "QIANFAN_TOKEN=${QIANFAN_TOKEN}" >> $GITHUB_ENV
        echo "RULIU_ACCESS_TOKEN=${RULIU_ACCESS_TOKEN}" >> $GITHUB_ENV
        echo "RULIU_TARGET_IDS=${RULIU_TARGET_IDS}" >> $GITHUB_ENV
    
    - name: Test connections
      run: |
        python main.py test
    
    - name: Run containerd release analysis
      run: |
        echo "🚀 Running containerd release analysis with prerelease support..."
        python main.py analyze --include-prerelease --no-notification
    
    - name: Commit and push reports
      if: always()
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Add reports if any exist
        if [ -d "reports" ] && [ "$(ls -A reports)" ]; then
          git add reports/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new reports to commit"
          else
            # Get the latest report info for commit message
            LATEST_REPORT=$(ls -t reports/*.md 2>/dev/null | head -1)
            if [ -n "$LATEST_REPORT" ]; then
              REPORT_NAME=$(basename "$LATEST_REPORT" .md)
              git commit -m "Add containerd release analysis: $REPORT_NAME"
            else
              git commit -m "Add containerd release analysis reports"
            fi

            # Push changes
            git push
            echo "✅ Reports committed and pushed to repository"
          fi
        else
          echo "No reports directory or files found"
        fi

    - name: Upload reports as artifacts (backup)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: containerd-release-reports
        path: reports/
        retention-days: 30
    
    - name: Log completion
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Containerd release analysis completed successfully!"
        else
          echo "❌ Containerd release analysis failed. Check the logs above for details."
        fi
