name: Containerd Release Tracker

on:
  # Manual trigger
  workflow_dispatch:

jobs:
  analyze-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up environment variables
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        QIANFAN_TOKEN: ${{ secrets.QIANFAN_TOKEN }}
        RULIU_ACCESS_TOKEN: ${{ secrets.RULIU_ACCESS_TOKEN }}
        RULIU_TARGET_IDS: ${{ secrets.RULIU_TARGET_IDS }}
      run: |
        echo "GITHUB_TOKEN=${GITHUB_TOKEN}" >> $GITHUB_ENV
        echo "QIANFAN_TOKEN=${QIANFAN_TOKEN}" >> $GITHUB_ENV
        echo "RULIU_ACCESS_TOKEN=${RULIU_ACCESS_TOKEN}" >> $GITHUB_ENV
        echo "RULIU_TARGET_IDS=${RULIU_TARGET_IDS}" >> $GITHUB_ENV
    
    - name: Test connections
      run: |
        python main.py test
    
    - name: Run containerd release analysis
      run: |
        echo "🚀 Running containerd release analysis with prerelease support..."
        python main.py analyze --include-prerelease
    
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: containerd-release-reports
        path: reports/
        retention-days: 30
    
    - name: Log completion
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Containerd release analysis completed successfully!"
        else
          echo "❌ Containerd release analysis failed. Check the logs above for details."
        fi
