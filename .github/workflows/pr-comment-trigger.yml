name: PR Comment Trigger

on:
  issue_comment:
    types: [created]

jobs:
  check-and-run:
    # Only run on pull request comments
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    
    steps:
    - name: Check for /rerun command and permissions
      id: check
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const issue = context.issue;
          const username = context.payload.comment.user.login;
          const commentBody = context.payload.comment.body.trim();
          
          // Check if comment contains /rerun command
          const rerunRegex = /^\/rerun\s*$/m;
          if (!rerunRegex.test(commentBody)) {
            console.log('Comment does not contain /rerun command');
            return { shouldRun: false, reason: 'No /rerun command found' };
          }
          
          // Check user permissions
          try {
            const permissionLevel = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: issue.owner,
              repo: issue.repo,
              username: username,
            });
            
            const allowedPermissions = ['admin', 'write'];
            if (allowedPermissions.includes(permissionLevel.data.permission)) {
              console.log(`User ${username} with permission ${permissionLevel.data.permission} has access to trigger analysis`);
              return { shouldRun: true, reason: 'Permission granted' };
            } else {
              console.log(`User ${username} with permission ${permissionLevel.data.permission} does not have access to trigger analysis`);
              return { shouldRun: false, reason: 'Insufficient permissions' };
            }
          } catch (error) {
            console.log(`Error checking permissions for ${username}: ${error.message}`);
            return { shouldRun: false, reason: 'Permission check failed' };
          }
        result-encoding: string
    
    - name: Parse check result
      id: parse
      run: |
        RESULT='${{ steps.check.outputs.result }}'
        echo "Check result: $RESULT"
        
        # Parse JSON result
        SHOULD_RUN=$(echo "$RESULT" | jq -r '.shouldRun')
        REASON=$(echo "$RESULT" | jq -r '.reason')
        
        echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
        echo "reason=$REASON" >> $GITHUB_OUTPUT
    
    - name: Add reaction to comment
      if: steps.parse.outputs.should_run == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          await github.rest.reactions.createForIssueComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            comment_id: context.payload.comment.id,
            content: 'rocket'
          });
    
    - name: Checkout repository
      if: steps.parse.outputs.should_run == 'true'
      uses: actions/checkout@v4
    
    - name: Set up Python
      if: steps.parse.outputs.should_run == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      if: steps.parse.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up environment variables
      if: steps.parse.outputs.should_run == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        QIANFAN_TOKEN: ${{ secrets.QIANFAN_TOKEN }}
        RULIU_ACCESS_TOKEN: ${{ secrets.RULIU_ACCESS_TOKEN }}
        RULIU_TARGET_IDS: ${{ secrets.RULIU_TARGET_IDS }}
      run: |
        echo "GITHUB_TOKEN=${GITHUB_TOKEN}" >> $GITHUB_ENV
        echo "QIANFAN_TOKEN=${QIANFAN_TOKEN}" >> $GITHUB_ENV
        echo "RULIU_ACCESS_TOKEN=${RULIU_ACCESS_TOKEN}" >> $GITHUB_ENV
        echo "RULIU_TARGET_IDS=${RULIU_TARGET_IDS}" >> $GITHUB_ENV
    
    - name: Run containerd release analysis
      if: steps.parse.outputs.should_run == 'true'
      id: analysis
      run: |
        echo "🚀 Running containerd release analysis with prerelease support..."
        python main.py analyze --include-prerelease
        echo "analysis_status=success" >> $GITHUB_OUTPUT
      continue-on-error: true
    
    - name: Comment on success
      if: steps.parse.outputs.should_run == 'true' && steps.analysis.outputs.analysis_status == 'success'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const message = `✅ Containerd release analysis completed successfully! 
          
          📊 Analysis included prerelease versions and notification was sent to Ruliu.
          📋 Check the [workflow run](${runUrl}) for detailed logs.`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: message
          });
    
    - name: Comment on failure
      if: steps.parse.outputs.should_run == 'true' && steps.analysis.outputs.analysis_status != 'success'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const message = `❌ Containerd release analysis failed.
          
          🔍 Please check the [workflow run](${runUrl}) for error details.
          💡 Common issues: API token configuration, network connectivity, or service availability.`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: message
          });
    
    - name: Comment on permission denied
      if: steps.parse.outputs.should_run == 'false'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const reason = '${{ steps.parse.outputs.reason }}';
          let message;
          
          if (reason === 'No /rerun command found') {
            // Don't comment for non-rerun comments
            return;
          } else if (reason === 'Insufficient permissions') {
            message = `🚫 Sorry, you don't have permission to trigger the containerd release analysis.
            
            Only users with write or admin access can use the \`/rerun\` command.`;
          } else {
            message = `⚠️ Unable to process the /rerun command: ${reason}`;
          }
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: message
          });
